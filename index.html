<style>
  :root{
    --ink:#15110D;
    --ink-2:#1E1710;
    --ink-3:#2A2015;
    --cream:#F4ECDC;
    --cream-dim:#C9BFAE;
    --marigold:#E8760F;
    --maroon:#8A1F2B;
    --gold:#D8A94E;
    --leaf:#5C7A4F;
    --focus:#D8A94E;
    --radius-frame: 4px;
    --serif-track: -0.01em;
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ color-scheme: dark; }
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1,h2,h3{
    font-family:'Bricolage Grotesque', system-ui, sans-serif;
    font-weight:700;
    line-height:1.05;
    letter-spacing:var(--serif-track);
    margin:0;
  }

  a{ color:inherit; }
  img,svg{ max-width:100%; display:block; }

  ::selection{ background:var(--marigold); color:var(--ink); }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
    border-radius:2px;
  }

  /* film grain overlay */
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:999;
    opacity:0.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- timeline rail ---------- */
  .rail{
    position:fixed;
    left:0; top:0; bottom:0;
    width:78px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:space-between;
    padding:28px 0;
    z-index:40;
    pointer-events:none;
  }
  .rail-line{
    position:absolute; left:38px; top:0; bottom:0; width:1px;
    background:linear-gradient(var(--ink-3), var(--ink-3) 100%);
    opacity:0.6;
  }
  .rail .brandmark{
    pointer-events:auto;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--gold);
    background:var(--ink);
    padding:6px 3px;
    z-index:2;
  }
  .rail .tc{
    pointer-events:auto;
    font-variant-numeric:tabular-nums;
    font-size:11px;
    color:var(--cream-dim);
    background:var(--ink);
    padding:2px 4px;
    z-index:2;
    transition:color 0.25s ease;
  }
  .rail .tc.active{ color:var(--marigold); }
  @media (max-width:900px){ .rail{ display:none; } }

  /* ---------- nav ---------- */
  header.top{
    position:sticky; top:0; z-index:50;
    background:rgba(21,17,13,0.86);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--ink-3);
  }

    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    max-width:1180px; margin:0 auto;
  }

    font-weight:800;
    font-size:20px;
    letter-spacing:-0.01em;
  }
  .logo span{ color:var(--marigold); }
  nav.links{ display:flex; gap:28px; }
  nav.links a{
    text-decoration:none; font-size:14px; color:var(--cream-dim);
    transition:color 0.2s ease;
  }
  nav.links a:hover{ color:var(--cream); }

    transition:transform 0.15s ease, background 0.15s ease;
    white-space:nowrap;
  }
  .wa-btn:hover{ background:var(--gold); transform:translateY(-1px); }
  .wa-btn svg{ width:16px; height:16px; }

  /* ---------- sprocket strip ---------- */
  .sprockets{
    height:14px;
    background-image: radial-gradient(circle, var(--ink) 3px, transparent 3.5px);
    background-color:var(--ink-3);
    background-size:22px 14px;
    background-position:11px 7px;
  }

  /* ---------- hero ---------- */
  section.hero{
    position:relative;
    overflow:hidden;
    padding:96px 0 72px;
    margin-left:0;
  }
  section.hero .wrap{ position:relative; z-index:1; }
  @media (min-width:901px){ section.hero .wrap{ padding-left:106px; } }

  /* ---------- hero intro video ---------- */
  .hero-media{
    position:absolute; inset:0; z-index:0;
    overflow:hidden;
    background:linear-gradient(160deg, var(--ink-2), var(--maroon) 55%, var(--marigold));
  }
  .hero-media video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.55;
  }

  .sound-toggle{
    position:absolute; right:28px; bottom:28px; z-index:2;
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(21,17,13,0.55); backdrop-filter:blur(6px);
    border:1px solid var(--ink-3); color:var(--cream);

    transition:background 0.15s ease;
  }
  .sound-toggle:hover{ background:rgba(21,17,13,0.8); }
  .sound-toggle svg{ width:16px; height:16px; flex:none; }

    color:var(--cream-dim);
    font-size:13px;
  }

    width:8px; height:8px; border-radius:50%;
    background:var(--maroon);
    box-shadow:0 0 0 3px rgba(138,31,43,0.25);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  h1.hero-title{
    font-size:clamp(46px, 8vw, 96px);
    color:var(--cream);
    max-width:14ch;
  }
  h1.hero-title .stroke{
    -webkit-text-stroke:1.5px var(--gold);
    color:transparent;
  }

  p.hero-sub{
    margin:28px 0 0;
    max-width:52ch;
    font-size:18px;
    color:var(--cream-dim);
  }

  .hero-actions{
    display:flex; align-items:center; gap:20px;
    margin-top:36px; flex-wrap:wrap;
  }
  .btn-primary{
    background:var(--marigold); color:var(--ink);
    padding:15px 26px; border-radius:999px;
    font-weight:600; font-size:15px; text-decoration:none;
    display:inline-flex; align-items:center; gap:10px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover{ background:var(--gold); transform:translateY(-2px); }
  .btn-ghost{
    color:var(--cream); text-decoration:none; font-size:15px;
    border-bottom:1px solid var(--ink-3);
    padding-bottom:2px;
  }

  /* scrub / timeline bar */
  .scrub{
    margin-top:64px;
    max-width:560px;
  }
  .scrub-track{
    position:relative;
    height:3px; background:var(--ink-3); border-radius:3px;
    overflow:hidden;
  }
  .scrub-fill{
    position:absolute; left:0; top:0; bottom:0;
    width:38%;
    background:linear-gradient(90deg, var(--maroon), var(--marigold), var(--gold));
    animation:scrub 7s ease-in-out infinite;
  }
  @keyframes scrub{
    0%{ width:4%; }
    45%{ width:78%; }
    55%{ width:78%; }
    100%{ width:4%; }
  }
  .scrub-labels{
    display:flex; justify-content:space-between;
    margin-top:8px; font-size:11px; color:var(--cream-dim);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- section headers ---------- */
  section{ padding:64px 0; }
  @media (min-width:901px){ section .wrap{ padding-left:106px; } }
  .sec-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:24px; margin-bottom:40px; flex-wrap:wrap;
    border-bottom:1px solid var(--ink-3);
    padding-bottom:20px;
  }
  .sec-head h2{
    font-size:clamp(28px, 4vw, 42px);
    color:var(--cream);
  }
  .sec-head p{ color:var(--cream-dim); max-width:36ch; font-size:15px; margin:0; }

  /* ---------- filter tabs ---------- */
  .filter-tabs{
    display:flex; flex-wrap:wrap; gap:10px;
    margin:-16px 0 28px;
  }
  .filter-tabs button{
    background:transparent; border:1px solid var(--ink-3); color:var(--cream-dim);

    transition:color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .filter-tabs button:hover{ color:var(--cream); border-color:var(--gold); }
  .filter-tabs button.active{ background:var(--marigold); border-color:var(--marigold); color:var(--ink); font-weight:600; }

  /* ---------- showcase / clip cards ---------- */
  .clip-grid{
    display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start;
  }

  @media (max-width:520px){ .clip-grid{ grid-template-columns:1fr; } }

  .clip{
    position:relative;
    aspect-ratio:9/13;
    border-radius:var(--radius-frame);
    overflow:hidden;
    border:1px solid var(--ink-3);
    display:flex; flex-direction:column; justify-content:flex-end;

  }
  .clip::before{
    content:"";
    position:absolute; inset:0; z-index:-1;
    background:var(--bg-grad);
  }
  .clip::after{
    content:"";
    position:absolute; inset:0; z-index:-1;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");

  }
  .service-custom .service-body{ flex:1 1 360px; }
  .service-custom p{ max-width:60ch; }
  .service-custom h3{ color:var(--gold); }
  .service-cta{
    background:var(--marigold); color:var(--ink);
    padding:13px 24px; border-radius:999px;
    font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .service-cta:hover{ background:var(--gold); transform:translateY(-2px); }

  /* ---------- case studies ---------- */
  .case{
    display:grid; grid-template-columns:auto 1fr; gap:48px; align-items:center;
    padding:8px 0 40px;
  }
  .case + .case{ border-top:1px solid var(--ink-3); padding-top:40px; }
  @media (max-width:820px){ .case{ grid-template-columns:1fr; gap:24px; } }
  .case-media{
    position:relative; overflow:hidden; cursor:pointer;
    height:480px; aspect-ratio:var(--shape, 9/16); max-width:100%;
    border-radius:var(--radius-frame); border:1px solid var(--ink-3);
    background:linear-gradient(160deg,#1E1710,#E8760F);
    isolation:isolate; padding:0; color:inherit;
  }
  @media (max-width:820px){ .case-media{ width:100%; height:auto; } }
  .case-media:hover{ border-color:var(--gold); }
  .case-media video, .case-media img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-1;
  }
  .case-media .play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:56px; height:56px; border-radius:50%;
    background:rgba(21,17,13,0.6); display:flex; align-items:center; justify-content:center;
  }
  .case-media .play::before{
    content:""; margin-left:4px;
    border-style:solid; border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent var(--cream);
  }
  .case-tag{ font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--marigold); margin-bottom:10px; display:block; }
  .case h3{ font-size:clamp(24px, 3.4vw, 34px); color:var(--cream); }
  .case-client{ margin:10px 0 24px; font-size:14px; color:var(--cream-dim); }
  .case-block{ margin-bottom:18px; max-width:56ch; }
  .case-block h4{
    margin:0 0 4px; font-family:'Inter', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--gold);
  }
  .case-block p{ margin:0; font-size:15px; color:var(--cream-dim); }
  .case-stats{ display:flex; flex-wrap:wrap; gap:14px 36px; margin:6px 0 4px; }
  .case-stat strong{ display:block; font-family:'Bricolage Grotesque', sans-serif; font-size:32px; color:var(--cream); line-height:1.1; }
  .case-stat span{ font-size:13px; color:var(--cream-dim); }
  .case-cta{
    margin-top:12px; padding-top:28px; border-top:1px solid var(--ink-3);
    display:flex; flex-wrap:wrap; align-items:center; gap:16px 28px;
  }
  .case-cta p{ margin:0; font-size:17px; color:var(--cream); }

  /* ---------- process (legit sequence) ---------- */
  .process{
    display:grid; grid-template-columns:repeat(4,1fr); gap:0;
    position:relative;
  }
  @media (max-width:900px){ .process{ grid-template-columns:1fr; } }
  .process::before{
    content:"";
    position:absolute; left:0; right:0; top:19px; height:1px;
    background:var(--ink-3);
  }
  @media (max-width:900px){ .process::before{ display:none; } }
  .step{ padding:0 20px 0 0; position:relative; }
  .step:first-child{ padding-left:0; }
  @media (max-width:900px){ .step{ padding:0 0 28px 26px; border-left:1px solid var(--ink-3); } .step:last-child{ padding-bottom:0; } }
  .step .num{
    width:38px; height:38px; border-radius:50%;
    background:var(--ink); border:1px solid var(--gold);
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:14px;
    position:relative; z-index:1; margin-bottom:18px;
  }
  @media (max-width:900px){ .step .num{ position:absolute; left:-19px; top:0; margin-bottom:0; } }
  .step h3{ font-size:16px; margin-bottom:6px; color:var(--cream); }
  .step p{ font-size:14px; color:var(--cream-dim); margin:0; max-width:26ch; }

  /* ---------- values strip ---------- */
  .values{
    display:grid; grid-template-columns:repeat(3,1fr); gap:24px;
  }
  @media (max-width:720px){ .values{ grid-template-columns:1fr; } }
  .value{
    border-top:2px solid var(--maroon);
    padding-top:16px;
  }
  .value:nth-child(2){ border-top-color:var(--marigold); }
  .value:nth-child(3){ border-top-color:var(--gold); }
  .value h3{ font-size:17px; margin-bottom:8px; }
  .value p{ font-size:14px; color:var(--cream-dim); margin:0; }

  /* ---------- contact ---------- */
  section.contact{
    background:var(--ink-2);
    border-top:1px solid var(--ink-3);
    border-bottom:1px solid var(--ink-3);
  }
  .contact-inner{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:40px; flex-wrap:wrap;
  }
  .contact h2{
    font-size:clamp(30px, 5vw, 56px);
    max-width:14ch;
  }
  .contact p{ color:var(--cream-dim); max-width:40ch; margin-top:16px; font-size:16px; }
  .contact-cta{
    display:flex; flex-direction:column; gap:14px; align-items:flex-start;
  }
  .contact-meta{ font-size:13px; color:var(--cream-dim); }

  /* ---------- footer ---------- */
  footer{
    padding:36px 0 48px;
  }
  @media (min-width:901px){ footer .wrap{ padding-left:106px; } }
  .foot-row{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px;
    font-size:13px; color:var(--cream-dim);
  }
  .foot-links{ display:flex; gap:18px; }
  .foot-links a{ text-decoration:none; color:var(--cream-dim); }
  .foot-links a:hover{ color:var(--cream); }

  /* ---------- video cards + lightbox (added) ---------- */
  .clip{
    aspect-ratio:var(--shape, 9/16);
    height:var(--card-h, 420px);
    flex:0 0 auto; max-width:100%;
    cursor:default;
  }
  @media (max-width:720px){ .clip{ width:100%; height:auto; } }
  .clip.playable{ cursor:pointer; }
  .clip.playable:hover{ border-color:var(--gold); }
  .clip .clip-video{
    position:absolute; inset:0; z-index:-1;
    width:100%; height:100%; object-fit:cover;
  }
  .clip .shade{
    position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(180deg, transparent 45%, rgba(21,17,13,0.85) 100%);
  }
  .clip .play{
    position:absolute; top:12px; left:12px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(21,17,13,0.55); display:none; align-items:center; justify-content:center;
  }
  .clip.playable .play{ display:flex; }
  .clip .play::before{
    content:""; margin-left:3px;
    border-style:solid; border-width:6px 0 6px 10px;
    border-color:transparent transparent transparent var(--cream);
  }
  .lightbox{
    position:fixed; inset:0; z-index:1000;
    background:rgba(10,8,6,0.94);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:56px 20px 24px; gap:14px;
  }
  .lightbox.open{ display:flex; }
  .lightbox video{
    aspect-ratio:var(--r, 1.7778);
    width:min(100%, calc(80vh * var(--r, 1.7778)));
    max-width:100%; max-height:80vh;
    object-fit:contain; background:#000; border-radius:4px;
  }
  .lightbox-title{ color:var(--cream-dim); font-size:14px; }
  .lightbox-close{
    position:absolute; top:14px; right:18px;
    background:transparent; border:1px solid var(--ink-3); color:var(--cream);
    width:40px; height:40px; border-radius:50%; font-size:22px; line-height:1; cursor:pointer;
  }
  .lightbox-close:hover{ border-color:var(--gold); }
</style>
</head>

      <svg class="icon-mute" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      <svg class="icon-unmute" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>

    <div class="wrap">

  <section id="services">

<script>
/* ==========================================================
   PAGE ENGINE — you don't need to edit below this line.
   It reads CONFIG (top of file) and builds the page.
   ========================================================== */
(function(){
  var C = CONFIG;
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  function make(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function get(path){ return path.split('.').reduce(function(o,k){ return o && o[k]; }, C); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmt(sec){ sec = Math.round(sec); return Math.floor(sec/60) + ':' + pad(sec%60); }

  // simple text bindings: <x data-cfg="hero.sub">
  $$('[data-cfg]').forEach(function(e){ e.textContent = get(e.getAttribute('data-cfg')) || ''; });

  // page title + description
  document.title = C.seo.title;
  [['meta[name="description"]'],['meta[property="og:title"]', C.seo.title],['meta[property="og:description"]']].forEach(function(p){
    var m = $(p[0]); if(!m) return;
    m.setAttribute('content', p[1] || (p[0].indexOf('title')>-1 ? C.seo.title : C.seo.description));
  });

  // logo + nav
  $('#logoLeft').textContent = C.brand.nameLeft;
  $('#logoRight').textContent = C.brand.nameRight;
  $('#logoRight').style.color = 'var(--marigold)';
  C.nav.forEach(function(n){
    var a = make('a', null, n.label); a.href = n.href; $('#navLinks').appendChild(a);
  });

  // WhatsApp links
  var num = C.whatsapp.countryCode + C.whatsapp.number.replace(/\D/g,'');
  var waUrl = 'https://wa.me/' + num + '?text=' + encodeURIComponent(C.whatsapp.message);
  $$('[data-wa]').forEach(function(a){ a.href = waUrl; });
  $$('[data-wa-plain]').forEach(function(a){ a.href = 'https://wa.me/' + num; });
  var n10 = C.whatsapp.number.replace(/\D/g,'');
  $('#contactNumber').textContent = C.contact.showNumber
    ? 'WhatsApp: +' + C.whatsapp.countryCode + ' ' + n10.slice(0,5) + ' ' + n10.slice(5) : '';

  // hero title with {outlined} word
  var t = $('#heroTitle');
  C.hero.title.split(/(\{[^}]+\})/).forEach(function(part){
    if(!part) return;
    if(part.charAt(0) === '{'){ t.appendChild(make('span','stroke', part.slice(1,-1))); }
    else t.appendChild(document.createTextNode(part));
  });

  // hero video
  (function(){
    var video = $('#heroReel'), media = $('#heroMedia'), btn = $('#soundToggle');
    function fallback(){ media.classList.add('media-fallback'); btn.style.display = 'none'; }
    if(!C.hero.video){ fallback(); return; }
    video.style.opacity = C.hero.videoBrightness;
    if(C.hero.poster) video.poster = C.hero.poster;
    var s = document.createElement('source'); s.src = C.hero.video; s.type = 'video/mp4';
    video.appendChild(s);
    video.addEventListener('error', fallback, true);
    btn.addEventListener('click', function(){
      video.muted = !video.muted;
      var un = !video.muted;
      btn.classList.toggle('is-unmuted', un);
      btn.setAttribute('aria-pressed', String(un));
      btn.setAttribute('aria-label', un ? 'Turn sound off' : 'Turn sound on');
      btn.querySelector('.sound-toggle-label').textContent = un ? 'Sound on' : 'Tap for sound';
    });
  })();

  // simple lists
  C.services.items.forEach(function(it, i){
    var d = make('div','service' + (it.cta ? ' service-custom' : ''));
    var body = it.cta ? make('div','service-body') : d;
    body.appendChild(make('span','idx', pad(i+1)));
    body.appendChild(make('h3', null, it.title));
    body.appendChild(make('p', null, it.text));
    if(it.cta){
      d.appendChild(body);
      var a = make('a','service-cta', it.cta);
      a.target = '_blank'; a.rel = 'noopener';
      a.href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(it.message || C.whatsapp.message);
      d.appendChild(a);
    }
    $('#serviceList').appendChild(d);
  });
  C.process.steps.forEach(function(it, i){
    var d = make('div','step');
    d.appendChild(make('span','num', String(i+1)));
    d.appendChild(make('h3', null, it.title));
    d.appendChild(make('p', null, it.text));
    $('#processList').appendChild(d);
  });
  C.why.items.forEach(function(it){
    var d = make('div','value');
    d.appendChild(make('h3', null, it.title));
    d.appendChild(make('p', null, it.text));
    $('#valueList').appendChild(d);
  });

  // work: cards, filters, lightbox
  var grid = $('#clipGrid');
  grid.style.setProperty('--card-h', (C.work.cardHeight || 420) + 'px');
  var defaultShape = C.work.cardShape || 'auto';
  var labels = {}; C.work.categories.forEach(function(c){ labels[c.id] = c.label; });
  var lb = $('#lightbox'), lbVideo = $('#lightboxVideo'), lbTitle = $('#lightboxTitle');

  function setLbRatio(r){ if(r && isFinite(r)) lbVideo.style.setProperty('--r', r); }
  lbVideo.addEventListener('loadedmetadata', function(){
    if(lbVideo.videoWidth && lbVideo.videoHeight) setLbRatio(lbVideo.videoWidth / lbVideo.videoHeight);
  });
  function openLightbox(clip, ratio){
    setLbRatio(ratio);                         // open at the card's ratio right away, then correct from the real video
    if(clip.poster) lbVideo.poster = clip.poster; else lbVideo.removeAttribute('poster');
    lbVideo.src = encodeURI(clip.video);
    lbTitle.textContent = clip.title;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbVideo.play().catch(function(){});
  }
  function closeLightbox(){
    lbVideo.pause(); lbVideo.removeAttribute('src'); lbVideo.load();
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  $('#lightboxClose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', function(e){ if(e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && lb.classList.contains('open')) closeLightbox(); });

  var grads = ['#7A1F2B,#E8760F','#2A2015,#5C7A4F','#8A1F2B,#D8A94E','#1E1710,#E8760F'];
  C.work.clips.forEach(function(clip, i){
    var card = make('div','clip');
    card.dataset.category = clip.category;
    var forced = clip.shape || (defaultShape !== 'auto' ? defaultShape : '');
    card.style.setProperty('--shape', forced || '9 / 16');
    card.style.setProperty('--bg-grad', 'linear-gradient(160deg,' + grads[i % grads.length] + ')');
    var dur = make('span','dur', clip.duration || '');
    if(!clip.duration) dur.style.display = 'none';

    if(clip.video){
      var v = document.createElement('video');
      v.className = 'clip-video'; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
      var gotVideoRatio = false;
      function setShape(w, h){ if(w && h){ card.dataset.ratio = w / h; if(!forced) card.style.setProperty('--shape', w + ' / ' + h); } }
      if(clip.poster){
        v.poster = clip.poster;                // thumbnail you uploaded
        var pi = new Image();                  // use its ratio straight away, before the video loads
        pi.onload = function(){ if(!gotVideoRatio) setShape(pi.naturalWidth, pi.naturalHeight); };
        pi.src = encodeURI(clip.poster);
      }
      v.src = encodeURI(clip.video) + (clip.poster ? '' : '#t=0.1');
      v.addEventListener('loadedmetadata', function(){
        gotVideoRatio = true;
        setShape(v.videoWidth, v.videoHeight); // the real video ratio always wins
        card.classList.add('playable'); card.tabIndex = 0; card.setAttribute('role','button');
        card.setAttribute('aria-label','Play ' + clip.title);
        if(!clip.duration && isFinite(v.duration)){ dur.textContent = fmt(v.duration); dur.style.display = ''; }
      });
      v.addEventListener('error', function(){ v.remove(); });
      card.addEventListener('mouseenter', function(){ if(card.classList.contains('playable')) v.play().catch(function(){}); });
      card.addEventListener('mouseleave', function(){ v.pause(); if(clip.poster){ v.load(); } else { v.currentTime = 0.1; } });
      card.appendChild(v);
    }
    card.appendChild(make('div','shade'));
    card.appendChild(make('span','play'));
    card.appendChild(dur);
    card.appendChild(make('span','cat', labels[clip.category] || clip.category));
    card.appendChild(make('h3', null, clip.title));
    if(clip.note) card.appendChild(make('p', null, clip.note));

    function activate(){ if(card.classList.contains('playable')) openLightbox(clip, parseFloat(card.dataset.ratio)); }
    card.addEventListener('click', activate);
    card.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); } });
    grid.appendChild(card);
  });

  // case studies
  C.caseStudies.items.forEach(function(cs){
    var art = make('article','case');
    var media = make('div','case-media');
    if(cs.video){
      media.setAttribute('role','button'); media.tabIndex = 0;
      media.setAttribute('aria-label','Play ' + cs.title);
      var cv = document.createElement('video');
      cv.muted = true; cv.loop = true; cv.playsInline = true; cv.preload = 'metadata';
      if(cs.poster) cv.poster = cs.poster;
      cv.src = encodeURI(cs.video) + (cs.poster ? '' : '#t=0.1');
      cv.addEventListener('loadedmetadata', function(){
        if(cv.videoWidth && cv.videoHeight){
          media.style.setProperty('--shape', cv.videoWidth + ' / ' + cv.videoHeight);
          media.dataset.ratio = cv.videoWidth / cv.videoHeight;
        }
      });
      cv.addEventListener('error', function(){ cv.remove(); });
      media.addEventListener('mouseenter', function(){ cv.play().catch(function(){}); });
      media.addEventListener('mouseleave', function(){ cv.pause(); if(!cs.poster) cv.currentTime = 0.1; });
      media.appendChild(cv);
      media.appendChild(make('span','play'));
      var open = function(){ openLightbox({ title: cs.title, video: cs.video, poster: cs.poster }, parseFloat(media.dataset.ratio)); };
      media.addEventListener('click', open);
      media.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
      art.appendChild(media);
    }
    var txt = make('div','case-text');
    if(cs.label) txt.appendChild(make('span','case-tag', cs.label));
    txt.appendChild(make('h3', null, cs.title));
    if(cs.client) txt.appendChild(make('p','case-client', cs.client));
    [['The brief', cs.brief], ['What we did', cs.approach], ['The result', cs.result]].forEach(function(b){
      if(!b[1]) return;
      var blk = make('div','case-block');
      blk.appendChild(make('h4', null, b[0]));
      blk.appendChild(make('p', null, b[1]));
      txt.appendChild(blk);
    });
    if(cs.stats && cs.stats.length){
      var st = make('div','case-stats');
      cs.stats.forEach(function(x){
        var sd = make('div','case-stat');
        sd.appendChild(make('strong', null, x.value));
        sd.appendChild(make('span', null, x.label));
        st.appendChild(sd);
      });
      txt.appendChild(st);
    }
    art.appendChild(txt);
    $('#caseList').appendChild(art);
  });
  $('#caseCta').href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(C.caseStudies.ctaMessage || C.whatsapp.message);

  var tabs = $('#filterTabs');
  [{id:'all', label:'All'}].concat(C.work.categories).forEach(function(cat, i){
    var b = make('button', i === 0 ? 'active' : '', cat.label);
    b.type = 'button'; b.dataset.filter = cat.id; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', function(){
      $$('button', tabs).forEach(function(x){ x.classList.remove('active'); x.setAttribute('aria-pressed','false'); });
      b.classList.add('active'); b.setAttribute('aria-pressed','true');
      $$('.clip', grid).forEach(function(c){
        c.style.display = (cat.id === 'all' || c.dataset.category === cat.id) ? '' : 'none';
      });
    });
    tabs.appendChild(b);
  });

  // left-rail timecode highlight
  var tcs = $$('.rail .tc');
  var secs = ['top','work','services','case-studies','process','why'].map(function(id){ return document.getElementById(id); });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        var idx = secs.indexOf(en.target);
        tcs.forEach(function(tc, i){ tc.classList.toggle('active', i === idx); });
      }
    });
  }, { rootMargin: '-40% 0px -50% 0px' });
  secs.forEach(function(s){ io.observe(s); });
})();
</script>

</body>
</html>
